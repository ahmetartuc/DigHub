name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -race ./...

    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted:"
          gofmt -s -l .
          exit 1
        fi

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Cross-compile binaries
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ "$GITHUB_EVENT_NAME" = release ] || VERSION="dev-${GITHUB_SHA::7}"
        mkdir -p dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
          os="${target%/*}"; arch="${target#*/}"
          ext=""; [ "$os" = windows ] && ext=".exe"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/dighub-${os}-${arch}${ext}" .
        done
        cd dist && sha256sum dighub-* > checksums.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dighub-binaries
        path: dist/*

  release:
    name: Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: dighub-binaries
        path: dist

    - name: Upload release assets
      run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
